<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DailyKids Quest IV</title>
<link rel="stylesheet" href="./styles.css">
<style>
  body { background: var(--color-neutral-200); }
  .phone {
    max-width: 440px; min-height: 100dvh; margin: 0 auto;
    background: var(--color-bg); display: flex; flex-direction: column;
    box-shadow: var(--shadow-md);
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--color-divider);
    font-size: 12px; color: var(--color-neutral-600); grid-area: top;
  }
  .topbar > span { font-family: var(--font-heading); font-size: 14px; color: var(--color-text); white-space: nowrap; }
  .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .logout-label { display: none; }
  main { flex: 1; display: flex; flex-direction: column; grid-area: main; }
  .bottom-nav {
    display: flex; justify-content: space-around; align-items: center;
    padding: 10px 16px; border-top: 1px solid var(--color-divider);
    position: sticky; bottom: 0; background: var(--color-bg); grid-area: nav;
  }
  .no-nav .bottom-nav { display: none; }
  .bottom-nav button {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: 0; cursor: pointer; color: var(--color-neutral-600);
    font-family: var(--font-heading); font-size: 11px; padding: 4px 10px; border-radius: 12px;
  }
  .bottom-nav button.active { color: var(--color-accent-700); }
  .bottom-nav button .ico { font-size: 19px; }
  .deck { display: grid; grid-template-columns: 1fr; gap: 10px; }

  /* ── Tablette : cadre plus large, listes de cartes sur 2 colonnes ── */
  @media (min-width: 760px) {
    .phone { max-width: 760px; }
    .logout-label { display: inline; }
    .deck-2 { grid-template-columns: 1fr 1fr; }
  }

  /* ── Ordinateur : navigation en barre latérale, contenu scrollable ── */
  @media (min-width: 1100px) {
    body { padding: 24px; }
    .phone {
      max-width: 1080px; height: calc(100dvh - 48px); min-height: 560px;
      border-radius: 24px; overflow: hidden;
      display: grid; grid-template-columns: 236px 1fr; grid-template-rows: auto 1fr;
      grid-template-areas: "top top" "nav main";
    }
    .phone.no-nav { grid-template-columns: 1fr; grid-template-areas: "top" "main"; }
    main { overflow: auto; padding: 0 40px; }
    .bottom-nav {
      position: static; flex-direction: column; justify-content: flex-start; align-items: stretch;
      gap: 4px; padding: 16px 14px; border-top: 0; border-right: 1px solid var(--color-divider); overflow: auto;
    }
    .bottom-nav button {
      flex-direction: row; justify-content: flex-start; gap: 12px; padding: 11px 14px; font-size: 13px;
    }
    .bottom-nav button.active { background: var(--color-accent-100); color: var(--color-accent-800); }
    .deck-2 { grid-template-columns: 1fr 1fr; }
    main > div { padding-left: 0 !important; padding-right: 0 !important; }
    /* Stats desktop optimization */
    #charts-container { grid-template-columns: 1fr 1fr; }
    #chart-tasks-per-day > div { height: 280px; min-width: 0; }
    #chart-progression table { font-size: 13px; }
    #chart-progression th, #chart-progression td { padding: 12px; }
    #chart-top-tasks { padding: 8px 0; }
  }
  .check {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; cursor: pointer;
    border: 2px solid var(--color-divider); background: transparent; padding: 0;
  }
  .check.done { background: var(--color-accent-2-500); border-color: var(--color-accent-2-500);
    color: #fff; font-size: 14px; }
  .task-icon {
    width: 40px; height: 40px; border-radius: 50%; background: var(--color-accent-2-100);
    display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0;
  }
  .kicker { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-600); }
  .lvlup-overlay { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 50; }
  .lvlup-badge {
    font-family: var(--font-heading); font-size: 32px; color: var(--color-accent-800);
    background: var(--color-accent-100); padding: 18px 34px; border-radius: 999px;
    box-shadow: var(--shadow-lg); animation: lvlpop 1.8s ease forwards;
  }
  @keyframes lvlpop {
    0% { transform: scale(0) rotate(-8deg); opacity: 0 }
    12% { transform: scale(1.15) rotate(2deg); opacity: 1 }
    22% { transform: scale(1) rotate(0) }
    80% { transform: scale(1); opacity: 1 }
    100% { transform: scale(0.85); opacity: 0 }
  }
  .lvlup-star { position: absolute; font-size: 26px; animation: starfly 1.6s ease-out forwards; }
  @keyframes starfly {
    0% { transform: translate(0, 0) scale(0.4); opacity: 1 }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0 }
  }
  #toast {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: var(--color-accent-800); color: #fff; padding: 10px 16px;
    border-radius: 999px; font-size: 13px; display: none; z-index: 60;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <span>DailyKids Quest IV</span>
    <div class="topbar-right">
      <select class="input" id="child-select" style="width:auto;min-height:30px;padding:2px 28px 2px 12px;font-size:13px"></select>
      <div class="seg" id="role-seg">
        <label class="seg-opt"><input type="radio" name="role" value="enfant"><span>Enfant</span></label>
        <label class="seg-opt"><input type="radio" name="role" value="parent"><span>Parent</span></label>
      </div>
      <button id="logout-btn" class="btn btn-secondary" data-action="logout" title="Se déconnecter" style="min-height:30px;padding:4px 12px;font-size:12px;gap:5px">🚪<span class="logout-label">Déconnexion</span></button>
    </div>
  </div>
  <main id="main"></main>
  <nav class="bottom-nav" id="nav"></nav>
</div>
<div id="toast">⚠️ Synchronisation échouée — vérifie ta connexion</div>

<script>
'use strict';
const TOKEN_KEY = 'te-token';

// ── état client (la source de vérité est le serveur) ──
let token = null;           // jeton de session (persisté)
let me = null;              // { email, name } de l'adulte connecté
let families = [];          // familles dont je suis membre (renvoyées par le serveur)
let activeFamily = 0;
let state = null;           // famille active — pointeur dans families[]
let parentUnlocked = false; // accès espace parent — en mémoire, retombe au rechargement
let authMode = 'login', authMsg = '', authRole = 'parent';
let resetPasswordStep = 0, resetEmail = '', resetMsg = ''; // modal réinitialisation password
let creatingPin = false; // affiche le formulaire de création de PIN
const unlocked = new Set(); // enfants déverrouillés (PIN) — en mémoire

// stats state
let statsChildIndex = 0;  // index de l'enfant sélectionné dans la vue stats
let statsPeriod = 'week'; // période sélectionnée: 'day', 'week', 'month', 'year'
let statsData = null;     // données de stats récupérées du serveur
let statsCharts = {};     // instances de Chart.js stockées pour mises à jour

const today = () => new Date().toLocaleDateString('fr-CA');
const LVL_XP = 100;
const level = xp => Math.floor(xp / LVL_XP) + 1;
// ponytail: barème fixe 16+/20 → 50 XP + 10 or, 12+ → 30 XP + 5 or, sinon 10 XP de participation ; rendre configurable si demandé
function gradeReward(note) {
  const n = parseFloat(String(note).replace(',', '.'));
  if (!(n >= 0 && n <= 20)) return null;
  return n >= 16 ? { xp: 50, gold: 10 } : n >= 12 ? { xp: 30, gold: 5 } : { xp: 10, gold: 0 };
}
function nextReward(gold, rewards) {
  return rewards.filter(r => r.cost > gold).sort((a, b) => a.cost - b.cost)[0] || null;
}
const loot = (xp, gold) => `<span class="tag tag-accent-2" style="margin-top:4px">+${xp} XP</span> <span class="tag tag-accent" style="margin-top:4px">+${gold} 🪙</span>`;
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const child = () => state.children[state.activeChild];
const frDate = () => {
  const d = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  return d[0].toUpperCase() + d.slice(1);
};

// ── réseau ──
async function api(action, body = {}) {
  const url = new URL('/api', window.location.origin).toString();
  if (action === 'saveFamily') console.log(`[API] Calling: ${url} with action=${action}`);
  const res = await fetch('/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: JSON.stringify({ action, ...body }),
  });
  let json = {};
  try { json = await res.json(); } catch {}
  if (action === 'saveFamily') console.log(`[API] Response status: ${res.status}, ok: ${res.ok}`);
  if (!res.ok) throw (json.error || `Erreur ${res.status}`);
  return json;
}
function toast(on) { document.getElementById('toast').style.display = on ? 'block' : 'none'; }

function setActiveFamily(i) {
  activeFamily = Math.max(0, Math.min(i, families.length - 1));
  state = families[activeFamily] || null;
  if (state) {
    state.role ??= 'enfant'; state.tab ??= 'accueil'; state.activeChild ??= 0;
    if (rolloverDay(state, today())) save();
  }
}
// reset des quêtes quotidiennes au chargement d'un nouveau jour (persisté)
function rolloverDay(f, day) {
  if (f.day === day) return false;
  f.day = day;
  f.children.forEach(c => c.tasks.forEach(t => { if (t.daily) t.done = false; }));
  return true;
}

// persistance de la famille active vers le serveur — coalescée (dernier gagne)
// ponytail: dernier-écrit-gagne, pas de verrou/etag — suffisant à l'échelle d'une famille ; passer à un merge/etag si conflits multi-appareils
let saving = false, dirty = false;
async function persistFamily() {
  if (!token || !state) return;
  dirty = true;
  if (saving) return;
  saving = true;
  while (dirty) {
    dirty = false;
    try {
      const payload = { family: stripUi(state) };
      const lucas = payload.family.children?.find(c => c.name === 'Lucas');
      console.log(`[SAVE] Lucas in payload BEFORE send:`, JSON.stringify(lucas?.tasks?.map(t => ({ name: t.name, done: t.done, completedAt: t.completedAt }))));
      console.log(`[SAVE] Token present:`, !!token);
      const res = await api('saveFamily', payload);
      if (res.family) {
        console.log(`[SAVE] Backend returned Lucas:`, JSON.stringify(res.family.children?.find(c => c.name === 'Lucas')?.tasks?.map(t => ({ name: t.name, done: t.done, completedAt: t.completedAt }))));
        Object.assign(state, res.family);
      }
      console.log(`[SAVE] Success`);
      toast(false);
    }
    catch (e) { console.log(`[SAVE] Error:`, e); toast(true); break; }
  }
  saving = false;
  localStorage.setItem('statsChildIndex', statsChildIndex);
  localStorage.setItem('statsPeriod', statsPeriod);
}
function stripUi(f) { const { role, tab, activeChild, memberInfo, ...rest } = f; return rest; }
function save() { persistFamily(); }

/* ── écrans enfant & parent ── */

function taskRow(t, i, small) {
  const sz = small ? 22 : 26;
  return `
  <div class="card elev-sm" style="flex-direction:row;align-items:center;gap:12px;padding:${small ? 12 : 14}px${t.done ? ';opacity:0.6' : ''}">
    ${small ? '' : `<div class="task-icon">${t.icon || '⭐'}</div>`}
    <button class="check${t.done ? ' done' : ''}" style="width:${sz}px;height:${sz}px" data-action="toggle-task" data-i="${i}" aria-label="${t.done ? 'Fait' : 'À faire'}">${t.done ? '✓' : ''}</button>
    <div style="flex:1">
      <div class="card-title" style="font-size:${small ? 14 : 15}px${t.done ? ';text-decoration:line-through' : ''}">${esc(t.name)}</div>
      ${loot(t.xp, t.gold)}${t.daily ? ' <span class="tag tag-neutral" style="margin-top:4px">🎯</span>' : ''}
    </div>
    ${small ? `<button class="btn btn-icon btn-ghost" data-action="del-task" data-i="${i}" aria-label="Supprimer">✕</button>` : ''}
  </div>`;
}

function screenAccueil() {
  const c = child();
  return `
  <div style="padding:22px 20px 4px;display:flex;align-items:flex-start;justify-content:space-between">
    <div>
      <div style="font-size:13px;color:var(--color-neutral-600)">Salut 👋</div>
      <h2 style="margin:2px 0 0;font-size:26px">${esc(c.name)}</h2>
    </div>
    <div style="display:flex;align-items:center;gap:6px;background:var(--color-accent-100);color:var(--color-accent-800);padding:8px 14px;border-radius:999px;font-family:var(--font-heading);font-size:16px">🪙 ${c.gold}</div>
  </div>
  <div style="margin:12px 20px 0;padding:12px 16px;border-radius:var(--radius-lg);background:var(--color-accent-2-100);display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <span style="font-family:var(--font-heading);font-size:16px;color:var(--color-accent-2-800)">⚔️ Niveau ${level(c.xp)}</span>
      <span style="font-size:12px;color:var(--color-accent-2-700)">${c.xp % LVL_XP}/${LVL_XP} XP</span>
    </div>
    <div style="height:8px;border-radius:999px;background:var(--color-accent-2-300);overflow:hidden">
      <div style="height:100%;width:${(c.xp % LVL_XP) / LVL_XP * 100}%;background:var(--color-accent-2-600);border-radius:999px"></div>
    </div>
  </div>
  ${(() => {
    const daily = c.tasks.filter(t => t.daily);
    if (!daily.length) return '';
    const doneN = daily.filter(t => t.done).length;
    const got = c.dailyBonusDay === state.day;
    return `
    <div style="margin:10px 20px 0;padding:12px 16px;border-radius:var(--radius-lg);background:var(--color-surface);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font-family:var(--font-heading);font-size:15px">🎯 Mission du jour · ${doneN}/${daily.length}</span>
        ${got ? '<span class="tag tag-accent-2">Bonus reçu 🎁</span>' : loot(state.dailyBonus.xp, state.dailyBonus.gold).replaceAll('margin-top:4px', '')}
      </div>
      <div style="height:6px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden">
        <div style="height:100%;width:${doneN / daily.length * 100}%;background:var(--color-accent-500);border-radius:999px"></div>
      </div>
    </div>`;
  })()}
  <div style="padding:14px 20px 6px" class="kicker">Quêtes du jour · ${frDate()}</div>
  <div class="deck deck-2" style="padding:4px 20px 16px">
    ${c.tasks.map((t, i) => taskRow(t, i, false)).join('') || "<p class='text-muted' style='padding-top:8px'>Aucune quête pour aujourd'hui 🎉</p>"}
  </div>
  <div style="padding:14px 20px 4px" class="kicker">💡 Proposer une quête</div>
  <div style="padding:0 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1">
    <div class="card elev-sm" style="gap:8px">
      <div class="field" style="margin:0"><label>Nom de la quête</label><input class="input" id="propose-task-name" placeholder="Ex : Laver la voiture"></div>
      <div style="display:flex;gap:8px">
        <div class="field" style="margin:0;flex:1"><label>XP</label><input class="input" id="propose-task-xp" type="number" min="1" placeholder="Ex : 25"></div>
        <div class="field" style="margin:0;flex:1"><label>Or 🪙</label><input class="input" id="propose-task-gold" type="number" min="0" placeholder="Ex : 15"></div>
      </div>
      <button class="btn btn-primary btn-block" data-action="propose-task">Proposer</button>
    </div>
  </div>`;
}

function screenNotes() {
  const c = child();
  const pending = (state.gradeRequests || []).filter(r => r.child === c.name && r.status === 'pending');
  const approved = (state.gradeRequests || []).filter(r => r.child === c.name && r.status === 'approved');

  return `
  <div style="padding:22px 20px 4px">
    <h2 style="margin:0;font-size:24px">Mes notes 📘</h2>
    <p style="margin:6px 0 0;font-size:13px;color:var(--color-neutral-600)">Soumet tes notes pour gagner de l'or !</p>
  </div>
  <div style="padding:16px 20px;display:flex;flex-direction:column;gap:14px;flex:1;overflow:auto">
    ${approved.length > 0 ? `
    <div>
      <div class="kicker" style="margin-bottom:10px">Notes approuvées ✅</div>
      ${approved.map(r => `
      <div class="card elev-sm" style="gap:8px;margin-bottom:10px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="card-title" style="font-size:15px">${esc(r.subject)}</span>
          ${loot(0, r.gold)}
        </div>
        <div class="field" style="margin:0"><label>Note</label>
          <input class="input" value="${esc(r.grade)}" readonly>
        </div>
      </div>`).join('')}
    </div>` : ''}

    ${pending.length > 0 ? `
    <div>
      <div class="kicker" style="margin-bottom:10px">En attente d'approbation ⏳</div>
      ${pending.map(r => `
      <div class="card elev-sm" style="gap:8px;margin-bottom:10px;opacity:0.7">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="card-title" style="font-size:15px">${esc(r.subject)}</span>
          <span class="tag tag-accent">${r.gold} 🪙</span>
        </div>
        <div class="field" style="margin:0"><label>Note</label>
          <input class="input" value="${esc(r.grade)}" readonly>
        </div>
      </div>`).join('')}
    </div>` : ''}

    <div>
      <div class="kicker" style="margin-bottom:10px">Soumettre une note</div>
      <div class="card elev-sm" style="gap:12px;padding:16px">
        <div class="field">
          <label>Matière</label>
          <input class="input" id="grade-subject" placeholder="Ex : Mathématiques">
        </div>
        <div class="field">
          <label>Note obtenue</label>
          <input class="input" id="grade-value" placeholder="Ex : 18/20">
        </div>
        <div class="field">
          <label>Or demandé</label>
          <input class="input" id="grade-gold" type="number" min="0" placeholder="Ex : 20">
        </div>
        <button class="btn btn-primary btn-block" data-action="submit-grade">Soumettre</button>
      </div>
    </div>
  </div>`;
}

function screenRecompenses() {
  const c = child();
  const lv = level(c.xp);
  const next = nextReward(c.gold, state.rewards.filter(r => r.lvl <= lv));
  const pct = next ? Math.min(100, Math.round(c.gold / next.cost * 100)) : 100;
  const hist = state.requests.filter(r => r.child === c.name);
  const statusTag = { approved: '<span class="tag tag-accent-2">Achetée ✅</span>', pending: '<span class="tag tag-neutral">En attente</span>', refused: '<span class="tag tag-accent">Refusée</span>' };
  return `
  <div style="padding:22px 20px 4px"><h2 style="margin:0;font-size:24px">Boutique 🛒</h2></div>
  <div style="margin:14px 20px 18px;padding:16px;border-radius:var(--radius-lg);background:var(--color-accent-100);display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:baseline;justify-content:space-between">
      <span style="font-family:var(--font-heading);font-size:22px;color:var(--color-accent-800)">🪙 ${c.gold}</span>
      <span style="font-size:12px;color:var(--color-accent-700)">${next ? `prochain article à ${next.cost} 🪙` : 'Tout est à portée de bourse !'}</span>
    </div>
    <div style="height:8px;border-radius:999px;background:var(--color-accent-300);overflow:hidden">
      <div style="height:100%;width:${pct}%;background:var(--color-accent-600);border-radius:999px"></div>
    </div>
  </div>
  <div class="deck deck-2" style="padding:0 20px">
    ${state.rewards.map((r, i) => {
      const locked = r.lvl > lv;
      const manque = r.cost - c.gold;
      const pending = state.requests.some(q => q.child === c.name && q.name === r.name && q.status === 'pending');
      return `
      <div class="card elev-sm" style="flex-direction:row;align-items:center;gap:12px${locked || manque > 0 ? ';opacity:0.55' : ''}">
        <div style="font-size:24px">${locked ? '🔒' : r.icon}</div>
        <div style="flex:1"><div class="card-title" style="font-size:15px">${esc(r.name)}</div>
          <span class="tag tag-outline">${r.cost} 🪙</span>${r.lvl > 1 ? ` <span class="tag ${locked ? 'tag-accent' : 'tag-accent-2'}">Niv. ${r.lvl}</span>` : ''}</div>
        ${locked
          ? `<button class="btn btn-secondary" disabled>🔒 Niv. ${r.lvl}</button>`
          : manque > 0
            ? `<button class="btn btn-secondary" disabled>manque ${manque} 🪙</button>`
            : pending
              ? `<button class="btn btn-secondary" disabled>Commandé</button>`
              : `<button class="btn btn-primary" data-action="request-reward" data-i="${i}">Acheter</button>`}
      </div>`;
    }).join('')}
  </div>
  <div style="padding:20px 20px 8px" class="kicker">Mes achats</div>
  <div style="padding:0 20px 24px;display:flex;flex-direction:column;gap:8px">
    ${hist.map(r => `
    <div style="display:flex;align-items:center;justify-content:space-between;font-size:13px">
      <span>${r.icon} ${esc(r.name)}</span>${statusTag[r.status]}
    </div>`).join('') || "<p class='text-muted' style='font-size:13px'>Aucune demande pour l'instant.</p>"}
  </div>
  <div style="padding:0 20px 8px" class="kicker">Mes idées d'articles</div>
  <div style="padding:0 20px 24px;display:flex;flex-direction:column;gap:8px">
    ${state.proposals.map((p, i) => p.child !== c.name ? '' : `
    <div style="display:flex;align-items:center;justify-content:space-between;font-size:13px">
      <span>💡 ${esc(p.name)} (${p.cost} 🪙)</span>

function renderStatsCharts() {
  if (!statsData) return;

  // Render CSS-based charts (no Chart.js needed)
  const dates = Object.keys(statsData.dailyBreakdown).sort();
  const taskCounts = dates.map(d => statsData.dailyBreakdown[d].tasksCount);
  const avgTasks = taskCounts.length > 0 ? Math.round(taskCounts.reduce((a, b) => a + b, 0) / taskCounts.length) : 0;
  const maxTasks = Math.max(1, ...taskCounts);

  // Chart 1: Tasks per day (bar chart)
  const barChart = document.getElementById('chart-tasks-per-day');
  if (barChart) {
    barChart.innerHTML = `
      <div style="display:flex;align-items:flex-end;justify-content:center;height:150px;gap:12px;padding:8px;flex-wrap:wrap">
        ${dates.map(d => {
          const count = statsData.dailyBreakdown[d].tasksCount;
          const pct = (count / maxTasks) * 100;
          const isAboveAvg = count >= avgTasks;
          const dateLabel = new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' });
          return `
            <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 1 80px;min-width:60px">
              <div style="width:40px;height:${pct}px;background:${isAboveAvg ? '#22c55e' : '#9ca3af'};border-radius:4px;min-height:8px" title="${count} tâches"></div>
              <div style="font-size:11px;text-align:center;color:var(--color-neutral-600)">${dateLabel}</div>
              <div style="font-size:12px;font-weight:bold">${count}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // Chart 2: XP/Gold progression (table)
  let xpCum = 0, goldCum = 0;
  const progressionTable = document.getElementById('chart-progression');
  if (progressionTable) {
    progressionTable.innerHTML = `
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead>
          <tr style="border-bottom:2px solid var(--color-divider)">
            <th style="padding:8px;text-align:left">Date</th>
            <th style="padding:8px;text-align:right">XP total</th>
            <th style="padding:8px;text-align:right">Or total</th>
          </tr>
        </thead>
        <tbody>
          ${dates.map(d => {
            xpCum += statsData.dailyBreakdown[d].xp;
            goldCum += statsData.dailyBreakdown[d].gold;
            const dateLabel = new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'short', month: 'short', day: 'numeric' });
            return `
              <tr style="border-bottom:1px solid var(--color-divider)">
                <td style="padding:8px">${dateLabel}</td>
                <td style="padding:8px;text-align:right"><span style="color:var(--color-accent-2-800)">⭐ ${xpCum}</span></td>
                <td style="padding:8px;text-align:right"><span style="color:var(--color-accent-700)">🪙 ${goldCum}</span></td>
              </tr>
            `;
          }).join('')}
        </tbody>
      </table>
    `;
  }

  // Chart 3: Top 5 tasks (horizontal bars)
  const topTasksChart = document.getElementById('chart-top-tasks');
  if (topTasksChart && statsData.topTasks.length > 0) {
    const maxCount = Math.max(1, ...statsData.topTasks.map(t => t.count));
    topTasksChart.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:12px">
        ${statsData.topTasks.map(t => {
          const pct = (t.count / maxCount) * 100;
          return `
            <div>
              <div style="font-size:12px;margin-bottom:4px;display:flex;align-items:center;gap:6px">
                <span>${t.icon}</span>
                <span style="flex:1">${esc(t.name)}</span>
                <span style="font-weight:bold;color:var(--color-accent-800)">${t.count}x</span>
              </div>
              <div style="width:100%;height:16px;background:var(--color-neutral-200);border-radius:4px;overflow:hidden">
                <div style="width:${pct}%;height:100%;background:#06b6d4"></div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }
}

};

function hideSelect() { document.getElementById('child-select').style.display = 'none'; }
function setNav(html) {
  document.getElementById('nav').innerHTML = html;
  document.querySelector('.phone').classList.toggle('no-nav', html === '');
}

function render() {
  const role = state ? state.role : 'enfant';
  document.querySelector('.topbar > span').textContent =
    (state && role === 'parent' && me && parentUnlocked) ? '👪 ' + state.name : 'DailyKids Quest IV';
  document.getElementById('role-seg').style.display = me ? '' : 'none';
  document.getElementById('logout-btn').style.display = me ? '' : 'none';
  const roleInput = document.querySelector(`#role-seg input[value=${role}]`); if (roleInput) roleInput.checked = true;

  if (!me) { hideSelect(); return renderAuth(); }
  if (!families.length) { hideSelect(); state = null; return renderNoFamily(); }
  if (!state) setActiveFamily(0);

  if (state.role === 'parent' && !parentUnlocked) { hideSelect(); return renderUnlock(); }

  state.activeChild = Math.max(0, Math.min(state.activeChild, state.children.length - 1));
  if (!TABS[state.role].some(t => t[0] === state.tab)) state.tab = TABS[state.role][0][0];
  if (state.role === 'parent' && !state.children.length && !['enfants', 'famille'].includes(state.tab)) state.tab = 'enfants';
  const sel = document.getElementById('child-select');
  sel.style.display = state.role === 'enfant' && state.children.length ? '' : 'none';
  sel.innerHTML = state.children.map((c, i) => `<option value="${i}"${i === state.activeChild ? ' selected' : ''}>${esc(c.name)}</option>`).join('');

  if (state.role === 'enfant' && !state.children.length) {
    document.getElementById('main').innerHTML = '<p class="text-muted" style="padding:24px 20px">Aucun enfant configuré. Un parent doit en ajouter un.</p>';
    setNav('');
    return;
  }
  if (state.role === 'enfant' && !unlocked.has(child().name)) {
    if (creatingPin) return; // formulaire de PIN déjà affiché par childAuth
    document.getElementById('main').innerHTML = `
      <div style="padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center">
        <div style="font-size:44px">🔒</div>
        <h3 style="margin:0">Salut ${esc(child().name)} !</h3>

      `<button class="${id === state.tab ? 'active' : ''}" data-action="nav" data-tab="${id}"><span class="ico">${ico}</span><span>${label}</span></button>`).join(''));
    api('getTaskStats', {
      childId: state.children[statsChildIndex]?.id,
      period: statsPeriod

      document.getElementById('main').innerHTML = screenStats();

      console.error('Erreur statistiques:', err);

      `<button class="${id === state.tab ? 'active' : ''}" data-action="nav" data-tab="${id}"><span class="ico">${ico}</span><span>${label}</span></button>`).join(''));

// ponytail: PIN en clair dans la donnée famille — barrière anti-fratrie sur un appareil, pas de la vraie sécurité
function createPin(label) {
  const p1 = prompt(`Créer un code PIN ${label} (4 chiffres) :`);
  if (!p1 || !/^\d{4}$/.test(p1)) { if (p1 !== null) alert('PIN invalide : 4 chiffres attendus.'); return null; }
  if (prompt('Confirmer le code PIN :') !== p1) { alert('Les codes ne correspondent pas.'); return null; }
  return p1;
}
function checkPin(pin, label) {
  const p = prompt(`Code PIN ${label} :`);
  if (p === pin) return true;
  if (p !== null) alert('Code incorrect.');
  return false;
}
function renderPinPrompt(mode = 'create') {
  const c = child();
  const title = mode === 'create' ? 'Créer ton code PIN' : 'Entre ton code PIN';
  const desc = mode === 'create' ? 'Choisis un code PIN à 4 chiffres' : 'Code PIN de ' + c.name;

    <p class="text-muted" style="margin:0;text-align:center;font-size:13px">${desc}</p>
    <div class="field" style="margin:0;width:100%">
      <label>Code PIN (4 chiffres)</label>

    </div>
    ${confirmField}
    <button class="btn btn-primary btn-block" data-action="submit-pin" data-mode="${mode}">Valider</button>
    <button class="btn btn-ghost btn-block" data-action="cancel-pin">Annuler</button>
  </div>`;
  setNav('');
}
function childAuth(c) {
  if (unlocked.has(c.name)) return true;
  creatingPin = true;
  if (!c.pin) renderPinPrompt('create');
  else renderPinPrompt('enter');

/* ── actions ── */

const val = id => document.getElementById(id).value.trim();
function addQuestTo(c, t) { if (c && t) c.tasks.push({ icon: t.icon, name: t.name, xp: t.xp, gold: t.gold, done: false, daily: !!t.daily }); }
function replaceFamily(f) {
  const i = families.findIndex(x => x.id === f.id);
  if (i < 0) return;
  const prev = families[i];
  f.role = prev.role; f.tab = prev.tab; f.activeChild = prev.activeChild; // conserver l'état d'UI local
  families[i] = f;
  if (state && state.id === f.id) { activeFamily = i; state = f; }
}
function onAuthed(r) {
  token = r.token; localStorage.setItem(TOKEN_KEY, token);
  me = r.me; families = r.families || []; parentUnlocked = true; authMsg = '';
  if (families.length) { setActiveFamily(0); state.role = 'parent'; }
}

const ACTIONS = {
  nav: el => { state.tab = el.dataset.tab; },
  'toggle-task': el => {
    const c = child(), i = +el.dataset.i, t = c.tasks[i];
    if (!t.done) {
      // Enfant coche la tâche → créer une demande de validation
      state.taskRequests = state.taskRequests || [];
      state.taskRequests.push({
        child: c.name, taskIndex: i, taskName: t.name, xp: t.xp, gold: t.gold,
        status: 'pending', submittedAt: Date.now()
      });
    } else {
      // Enfant décoche → retirer de la queue
      state.taskRequests = state.taskRequests?.filter(req => !(req.child === c.name && req.taskIndex === i)) || [];
    }
    t.done = !t.done;
    if (t.done) {
      t.completedAt = Date.now();
    } else {
      t.completedAt = null;
    }
    save(); render();
  },
  'del-task': el => { child().tasks.splice(+el.dataset.i, 1); },
  'add-task': () => {
    const name = val('new-task-name'), xp = parseInt(val('new-task-xp'), 10), gold = parseInt(val('new-task-gold') || '0', 10);
    const daily = document.getElementById('new-task-daily').checked;
    if (!name || !(xp > 0) || !(gold >= 0)) return alert('Nom et XP (> 0) requis.');
    child().tasks.push({ icon: '⭐', name, xp, gold, done: false, daily });
  },
  'assign-quest': el => addQuestTo(child(), state.questList[+el.dataset.i]),
  'assign-quest-all': el => { const t = state.questList[+el.dataset.i]; state.children.forEach(c => addQuestTo(c, t)); },
  'del-quest-def': el => { state.questList.splice(+el.dataset.i, 1); },
  'add-quest-def': () => {
    const name = val('qd-name'), xp = parseInt(val('qd-xp'), 10), gold = parseInt(val('qd-gold') || '0', 10);
    const daily = document.getElementById('qd-daily').checked;
    if (!name || !(xp > 0) || !(gold >= 0)) return alert('Nom et XP (> 0) requis.');
    state.questList.push({ icon: '⭐', name, xp, gold, daily });
  },
  'approve-task': el => {
    const idx = +el.dataset.i;
    const req = (state.taskRequests || []).find((r, i) => i === idx && r.status === 'pending');
    console.log(`[APPROVE] Request found:`, req);
    console.log(`[APPROVE] Children in state:`, state.children?.map(c => ({ name: c.name, taskCount: c.tasks?.length })));
    if (!req) return;
    // Find the child and mark task as done
    let found = false;
    for (const c of state.children || []) {
      if (c.name === req.child && c.tasks && c.tasks[req.taskIndex]) {
        console.log(`[APPROVE] Found child ${c.name}, task at index ${req.taskIndex}`);
        const task = c.tasks[req.taskIndex];
        console.log(`[APPROVE] Before: task.done=${task.done}, completedAt=${task.completedAt}`);
        task.done = true;
        task.completedAt = Date.now();
        c.xp = (c.xp || 0) + req.xp;
        c.gold = (c.gold || 0) + req.gold;
        console.log(`[APPROVE] After: task.done=${task.done}, completedAt=${task.completedAt}`);
        found = true;
        break;
      }
    }
    if (!found) { console.log(`[APPROVE] FAILED: req.child=${req.child}, children=${state.children?.map(c => c.name).join(',')}, taskIndex=${req.taskIndex}`); }
    req.status = 'approved';
    save(); render();
  },
  'reject-task': el => {
    const idx = +el.dataset.i;
    const req = (state.taskRequests || []).find((r, i) => i === idx && r.child === child().name && r.status === 'pending');
    if (req) {
      const task = child().tasks[req.taskIndex];
      if (task) task.done = false;
    }
    state.taskRequests = (state.taskRequests || []).filter((r, i) => !(i === idx && r.child === child().name && r.status === 'pending'));
    save(); render();
  },
  'propose-task': () => {
    const name = val('propose-task-name'), xp = parseInt(val('propose-task-xp'), 10), gold = parseInt(val('propose-task-gold') || '0', 10);
    if (!name || !(xp > 0) || !(gold >= 0)) return alert('Nom et XP (> 0) requis.');
    state.proposals = state.proposals || [];
    state.proposals.push({ icon: '⭐', name, xp, gold, child: child().name, status: 'pending', proposedAt: Date.now() });
    document.getElementById('propose-task-name').value = '';
    document.getElementById('propose-task-xp').value = '';
    document.getElementById('propose-task-gold').value = '';
    save(); render();
  },
  'save-grades': () => {
    document.querySelectorAll('[data-grade]').forEach(inp => {
      const raw = inp.value.trim();
      if (!raw) return;
      const r = gradeReward(raw.split('/')[0]);
      if (r === null) return alert(`Note invalide : « ${raw} » (attendu : 0 à 20)`);
      const g = child().grades[+inp.dataset.grade];
      g.grade = raw.includes('/') ? raw : `${raw}/20`;
      g.xp = r.xp; g.gold = r.gold;
      child().xp += r.xp;
      child().gold += r.gold;
    });
  },
  'request-reward': el => {
    const r = state.rewards[+el.dataset.i];
    state.requests.push({ child: child().name, icon: r.icon, name: r.name, cost: r.cost, status: 'pending' });
  },
  approve: el => {
    const q = state.requests[+el.dataset.i];
    const c = state.children.find(c => c.name === q.child);
    if (c) c.gold = Math.max(0, c.gold - q.cost);
    q.status = 'approved';
  },
  refuse: el => { state.requests[+el.dataset.i].status = 'refused'; },
  'apply-sanction': el => {
    const s = state.sanctionsList[+el.dataset.i];
    child().sanctions.unshift({ motif: s.name, gold: s.gold });
    child().gold = Math.max(0, child().gold - s.gold);
  },
  'add-sanction-def': () => {
    const name = val('sanction-motif'), gold = parseInt(val('sanction-pts'), 10);
    if (!name || !(gold > 0)) return alert('Motif et or (> 0) requis.');
    state.sanctionsList.push({ name, gold });
  },
  'del-sanction-def': el => { state.sanctionsList.splice(+el.dataset.i, 1); },
  'unlock-child': () => { childAuth(child()); },
  'submit-pin': async () => {
    const c = child(), mode = document.querySelector('[data-action="submit-pin"]').dataset.mode;
    const pin1 = val('pin-input-1');
    if (!/^\d{4}$/.test(pin1)) { authMsg = 'PIN invalide : 4 chiffres attendus.'; render(); return; }
    if (mode === 'create') {
      const pin2 = val('pin-input-2');
      if (pin1 !== pin2) { authMsg = 'Les codes ne correspondent pas.'; render(); return; }
      c.pin = pin1;
    } else if (pin1 !== c.pin) {
      authMsg = 'Code PIN incorrect.'; render(); return;
    }
    creatingPin = false; await save(); unlocked.add(c.name); render();
  },
  'cancel-pin': () => { creatingPin = false; render(); },
  'submit-grade': async () => {
    const subject = val('grade-subject').trim(), gradeVal = val('grade-value').trim(), gold = parseInt(val('grade-gold'), 10);
    if (!subject || !gradeVal || !gold || gold <= 0) { alert('Tous les champs requis.'); return; }
    const c = child();
    await api('submitGrade', { familyId: state.id, childName: c.name, subject, grade: gradeVal, gold });
    state.gradeRequests = state.gradeRequests || [];
    state.gradeRequests.push({ child: c.name, subject, grade: gradeVal, gold, status: 'pending', submittedAt: Date.now() });
    document.getElementById('grade-subject').value = '';
    document.getElementById('grade-value').value = '';
    document.getElementById('grade-gold').value = '';
    render();
  },
  'del-reward': el => { state.rewards.splice(+el.dataset.i, 1); },
  'propose-reward': () => {
    const name = val('proposal-name'), cost = parseInt(val('proposal-cost'), 10);
    if (!name || !(cost > 0)) return alert('Idée et points (> 0) requis.');
    state.proposals.push({ child: child().name, name, cost, status: 'pending' });
  },
  'del-proposal': el => { state.proposals.splice(+el.dataset.i, 1); },
  'approve-proposal': el => {
    const [p] = state.proposals.splice(+el.dataset.i, 1);
    state.rewards.push({ icon: '💡', name: p.name, cost: p.cost, lvl: 1 });
  },
  'refuse-proposal': el => { state.proposals[+el.dataset.i].status = 'refused'; },
  'approve-grade': async el => {
    const i = +el.dataset.i;
    const pending = (state.gradeRequests || []).filter(r => r.status === 'pending');
    if (i < pending.length) {
      const gi = state.gradeRequests.indexOf(pending[i]);
      const newGold = parseInt(document.getElementById(`grade-gold-${i}`).value, 10) || 0;
      await api('approveGrade', { familyId: state.id, index: gi });
      state.gradeRequests[gi].status = 'approved';
      state.gradeRequests[gi].approvedAt = Date.now();
      state.gradeRequests[gi].gold = newGold;
      const child = state.children.find(c => c.name === pending[i].child);
      if (child) child.gold = (child.gold || 0) + newGold;
      render();
    }
  },
  'refuse-grade': el => {
    const i = +el.dataset.i;
    const pending = (state.gradeRequests || []).filter(r => r.status === 'pending');
    if (i < pending.length) {
      const gi = state.gradeRequests.indexOf(pending[i]);
      state.gradeRequests[gi].status = 'refused';
      save();
    }
  },
  'add-child': () => {
    const name = val('new-child-name');
    if (!name) return alert('Prénom requis.');
    if (state.children.some(c => c.name.toLowerCase() === name.toLowerCase())) return alert('Ce prénom existe déjà.');
    state.children.push({ name, xp: 0, gold: 0, tasks: [], grades: [], sanctions: [] });
  },
  'del-child': el => {
    const c = state.children[+el.dataset.i];
    if (!confirm(`Supprimer ${c.name} et toutes ses données ?`)) return;
    state.children.splice(+el.dataset.i, 1);
    state.requests = state.requests.filter(r => r.child !== c.name);
    state.proposals = state.proposals.filter(p => p.child !== c.name);
    state.gradeRequests = (state.gradeRequests || []).filter(r => r.child !== c.name);
    unlocked.delete(c.name);
  },
  'reset-child-pin': el => {
    const c = state.children[+el.dataset.i];
    if (!confirm(`Réinitialiser le PIN de ${c.name} ? Il devra en créer un nouveau.`)) return;
    c.pin = null;
    unlocked.delete(c.name);
    render();
  },
  'save-children': () => {
    save();
  },
  'set-auth': el => { authRole = el.dataset.authRole || 'parent'; render(); },
  'unlock-child-direct': async () => {
    const famname = val('ec-famname').trim(), name = val('ec-name').trim(), pin = val('ec-pin').trim();
    if (!famname || !name || !pin) { authMsg = 'Tous les champs requis.'; return; }
    if (!/^\d{4}$/.test(pin)) { authMsg = 'PIN invalide (4 chiffres).'; return; }
    const r = await api('unlockChildDirect', { familyName: famname, childName: name, pin });
    if (!r || !r.families || !r.families.length) { authMsg = 'Famille ou enfant introuvable, ou PIN incorrect.'; return; }
    me = { email: name + '@enfant.local', name };
    families = r.families;
    state = families[0]; state.role = 'enfant'; state.tab = 'accueil'; state.activeChild = 0; activeFamily = 0;
    unlocked.add(name);
  },
  'add-reward': () => {
    const name = val('new-reward-name'), cost = parseInt(val('new-reward-cost'), 10), lvl = parseInt(val('new-reward-lvl') || '1', 10);
    if (!name || !(cost > 0) || !(lvl >= 1)) return alert('Nom, prix (> 0) et niveau (≥ 1) requis.');
    state.rewards.push({ icon: '🎁', name, cost, lvl });
  },
  'set-stats-select-child': el => {
    statsChildIndex = +el.dataset.index;
    localStorage.setItem('statsChildIndex', statsChildIndex);
    document.getElementById('main').innerHTML = screenStats();
    api('getTaskStats', {
      childId: state.children[statsChildIndex]?.id,
      period: statsPeriod
    }).then(r => {
      statsData = r;
      renderStatsCharts();
    }).catch(err => {
      console.error('Erreur statistiques:', err);
      statsData = null;
    });
  },
  'set-stats-period': el => {
    statsPeriod = el.dataset.period;
    localStorage.setItem('statsPeriod', statsPeriod);
    document.getElementById('main').innerHTML = screenStats();
    api('getTaskStats', {
      childId: state.children[statsChildIndex]?.id,
      period: statsPeriod
    }).then(r => {
      statsData = r;
      renderStatsCharts();
    }).catch(err => {
      console.error('Erreur statistiques:', err);
      statsData = null;
    });
  },

  // ── actions serveur (async, gèrent leur propre persistance) ──
  login: async () => {
    const email = val('au-email').toLowerCase(), password = document.getElementById('au-pass').value;
    if (!email || !password) { authMsg = 'Email et mot de passe requis.'; return; }
    onAuthed(await api('login', { email, password }));
  },
  signup: async () => {
    const name = val('au-name'), email = val('au-email').toLowerCase(), password = document.getElementById('au-pass').value, familyName = val('au-fam');
    if (!name || !email || !password || !familyName) { authMsg = 'Tous les champs sont requis.'; return; }
    onAuthed(await api('signup', { name, email, password, familyName }));
  },
  unlockParent: async () => {
    const password = document.getElementById('pu-pass').value;
    const r = await api('verifyPassword', { password });
    if (r.ok) { parentUnlocked = true; authMsg = ''; } else authMsg = 'Mot de passe incorrect.';
  },
  'auth-toggle': () => { authMode = authMode === 'login' ? 'signup' : 'login'; authMsg = ''; },
  'show-reset-password': () => { resetPasswordStep = 1; resetEmail = ''; resetMsg = ''; render(); },
  'reset-password-step1': async () => {
    const email = val('reset-email'); if (!email) { resetMsg = 'Email requis.'; render(); return; }
    try {
      const r = await api('reset-password', { step: 1, email });
      resetEmail = email; resetPasswordStep = 2; resetMsg = '';
    } catch (e) { resetMsg = 'Erreur: ' + String(e); }
    render();
  },
  'reset-password-step2': async () => {
    const code = val('reset-code'), password = val('reset-password'), confirm = val('reset-password-confirm');
    if (!code || !password || !confirm) { resetMsg = 'Tous les champs requis.'; render(); return; }
    if (password !== confirm) { resetMsg = 'Les passwords ne correspondent pas.'; render(); return; }
    try {
      await api('reset-password', { step: 2, email: resetEmail, code, password });
      authMsg = 'Mot de passe changé! Reconnecte-toi.'; resetPasswordStep = 0; authMode = 'login';
    } catch (e) { resetMsg = 'Erreur: ' + String(e); }
    render();
  },
  logout: () => {
    token = null; localStorage.removeItem(TOKEN_KEY);
    me = null; families = []; state = null; parentUnlocked = false; authMode = 'login'; authMsg = '';
  },
  'switch-family': el => { const i = families.findIndex(f => f.id === el.dataset.id); if (i >= 0) { setActiveFamily(i); state.role = 'parent'; } },
  'add-family': async () => {
    const name = val('new-fam-name'); if (!name) { alert('Nom de la famille requis.'); return; }
    const r = await api('createFamily', { name });
    families.push(r.family); setActiveFamily(families.length - 1); state.role = 'parent';
  },
  'invite-adult': async () => {
    const email = val('invite-email').toLowerCase();
    const r = await api('invite', { familyId: state.id, email });
    replaceFamily(r.family);
    alert(`${email} peut désormais gérer « ${state.name} » en se connectant avec cet email.`);
  },
  'remove-adult': async el => {
    const email = el.dataset.email;
    if (!confirm(`Retirer l'accès de ${email} à « ${state.name} » ?`)) return;
    const r = await api('removeAdult', { familyId: state.id, email });
    replaceFamily(r.family);
  },
};
const SERVER_ACTIONS = new Set(['login', 'signup', 'unlockParent', 'auth-toggle', 'logout', 'switch-family', 'add-family', 'invite-adult', 'remove-adult', 'set-auth', 'unlock-child', 'unlock-child-direct', 'submit-pin', 'cancel-pin', 'show-reset-password', 'reset-password-step1', 'reset-password-step2', 'set-stats-select-child', 'set-stats-period', 'approve-task', 'reject-task']);

function celebrate(text) {
  const stars = ['⭐', '🎉', '✨', '💫', '🌟'];
  const o = document.createElement('div');
  o.className = 'lvlup-overlay';
  o.innerHTML = `<div class="lvlup-badge">${text}</div>` +
    stars.concat(stars).map((s, i) => {
      const a = i / 10 * 2 * Math.PI;
      return `<span class="lvlup-star" style="--dx:${Math.round(Math.cos(a) * 130)}px;--dy:${Math.round(Math.sin(a) * 130)}px">${s}</span>`;
    }).join('');
  document.body.appendChild(o);
  setTimeout(() => o.remove(), 1900);
}

// bonus de mission : accordé une fois par jour quand toutes les quêtes quotidiennes de l'enfant actif sont faites
function maybeAwardDailyBonus() {
  const c = state && state.children[state.activeChild];
  if (!c) return;
  const daily = c.tasks.filter(t => t.daily);
  if (daily.length && daily.every(t => t.done) && c.dailyBonusDay !== state.day) {
    c.dailyBonusDay = state.day;
    c.xp += state.dailyBonus.xp;
    c.gold += state.dailyBonus.gold;
  }
}

document.body.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action, fn = ACTIONS[act];
  if (!fn) return;
  if (SERVER_ACTIONS.has(act)) {
    try { await fn(el); } catch (err) { authMsg = String(err); }
    render();
    return;
  }
  if (!state) return;
  const c0 = state.children[state.activeChild];
  const lvl0 = c0 ? level(c0.xp) : 1;
  const bonus0 = c0 ? c0.dailyBonusDay : null;
  fn(el);
  state.activeChild = Math.max(0, Math.min(state.activeChild, state.children.length - 1));
  maybeAwardDailyBonus();
  const c = state.children[state.activeChild];
  if (state.role === 'enfant' && c) {
    if (c.dailyBonusDay === state.day && bonus0 !== state.day) celebrate(`🎯 Mission accomplie ! +${state.dailyBonus.xp} XP`);
    else if (level(c.xp) > lvl0) celebrate(`⚔️ Niveau ${level(c.xp)} !`);
  }
  save(); render();
});
document.getElementById('role-seg').addEventListener('change', e => {
  if (state) state.role = e.target.value;
  if (e.target.value === 'enfant') parentUnlocked = false; // re-verrouille l'espace parent
  render();
});
document.body.addEventListener('change', e => {
  if (e.target.name === 'auth-role') { authRole = e.target.value; authMsg = ''; render(); return; }
  if (e.target.id === 'stats-child-select') {
    statsChildIndex = +e.target.value;
    localStorage.setItem('statsChildIndex', statsChildIndex);
    document.getElementById('main').innerHTML = screenStats();
    api('getTaskStats', {
      childId: state.children[statsChildIndex]?.id,
      period: statsPeriod
    }).then(r => {
      statsData = r;
      document.getElementById('main').innerHTML = screenStats();
      renderStatsCharts();
    }).catch(err => {
      console.error('Erreur statistiques:', err);
      statsData = null;
    });
    return;
  }
  if ((e.target.name === 'child' || e.target.id === 'child-select') && state) { state.activeChild = +e.target.value; render(); }
});

console.assert(esc('<b>&"') === '&lt;b&gt;&amp;&quot;', 'esc');
console.assert((() => { const saved = state; const c = { tasks: [{ daily: true, done: true }, { daily: true, done: true }], xp: 0, gold: 0 }; state = { children: [c], activeChild: 0, day: 'D', dailyBonus: { xp: 30, gold: 15 } }; maybeAwardDailyBonus(); const first = c.dailyBonusDay === 'D' && c.xp === 30 && c.gold === 15; maybeAwardDailyBonus(); const once = c.xp === 30; state = saved; return first && once; })(), 'bonus mission une fois par jour');

/* boot : restaure la session depuis le jeton persisté, sinon écran de connexion */
async function boot() {
  token = localStorage.getItem(TOKEN_KEY);
  if (token) {
    try {
      const r = await api('me');
      if (!r.me) throw 'session invalide';
      me = r.me; families = r.families || []; parentUnlocked = false;
      if (families.length) setActiveFamily(0);
      if (localStorage.getItem('statsChildIndex')) {
        statsChildIndex = +localStorage.getItem('statsChildIndex');
      }
      if (localStorage.getItem('statsPeriod')) {
        statsPeriod = localStorage.getItem('statsPeriod');
      }
      render();
      return;
    } catch { token = null; localStorage.removeItem(TOKEN_KEY); }
  }
  me = null; families = []; state = null;
  render();
}
boot();
