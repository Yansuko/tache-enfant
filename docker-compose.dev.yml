version: '3.8'

services:
  # ============ Frontend + Backend combined ============
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dailykids-app-dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://dailykids:dailykids@db:5432/dailykids
      ADMIN_KEY: dev-admin-key-change-in-prod
      LOG_LEVEL: debug
      BREVO_API_KEY: ${BREVO_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./netlify/functions:/app/netlify/functions:ro
      - ./tache-enfant:/app/public:ro
      - ./server.js:/app/server.js:ro
    networks:
      - dailykids-net

  # ============ PostgreSQL Database ============
  db:
    image: postgres:16-alpine
    container_name: dailykids-db-dev
    environment:
      POSTGRES_DB: dailykids
      POSTGRES_USER: dailykids
      POSTGRES_PASSWORD: dailykids
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      # seed-demo.sql collides with migration.sql (same parent@demo.fr user). Demo data: `npm run dev:seed`.
      # Real data: `npm run migrate`. Pick one per fresh volume (`docker-compose -f docker-compose.dev.yml down -v` to reset).
      # - ./seed-demo.sql:/docker-entrypoint-initdb.d/02-seed-demo.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dailykids -d dailykids" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - dailykids-net

  # ============ PgAdmin for database inspection ============
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dailykids-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - dailykids-net

volumes:
  db-data:

networks:
  dailykids-net:
    driver: bridge
