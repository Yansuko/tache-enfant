# Site statique (tache-enfant/) + fonction serverless (netlify/functions/api.mjs)
# La fonction utilise Netlify Blobs — activé par défaut, aucune config requise.
[build]
  publish = "tache-enfant"
  functions = "netlify/functions"
  command = "npm run build:config"

# Environment: Do not scan firebase-config.js (it's generated at build time)
[build.environment]
  SECRETS_SCAN_ENABLED = "false"

# Route /api → la fonction (double sécurité avec le config.path de la fonction)
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
