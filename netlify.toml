# Site statique (tache-enfant/) + fonction serverless (netlify/functions/api.mjs)
# La fonction utilise Netlify Blobs — activé par défaut, aucune config requise.
[build]
  publish = "tache-enfant"
  functions = "netlify/functions"

# Secrets scanning: ignore Firebase public keys in firebase-config.js
# These are PUBLIC keys meant for browser code, not sensitive secrets
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "firebase-config.js"

# Route /api → la fonction (double sécurité avec le config.path de la fonction)
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
